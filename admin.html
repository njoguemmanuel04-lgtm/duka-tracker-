<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duka Tracker - Empire Admin</title>
<script>
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) { registration.unregister(); }
    });
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui} body{background:#f8fafc;padding-bottom:20px}
.header{background:#0f172a;color:white;padding:16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px} .logo span{color:#10b981}
.card{background:white;border-radius:16px;padding:16px;margin:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.btn{border:none;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.btn-accent{background:#10b981;color:white} 
.btn-wa{background:#059669;color:white} 
.btn-boss{background:#065f46;color:white} 
.btn-clerk{background:#1e293b;color:white}
.btn-danger{background:#dc2626;color:white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat h2{font-size:26px} .stat p{font-size:11px;color:#64748b}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:#e2e8f0;font-weight:800} 
.badge-green{background:#dcfce7;color:#166534} 
.badge-red{background:#fee2e2;color:#991b1b}
.input,.select{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:6px}
.shop-card{background:white;border-radius:16px;padding:14px;margin:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #e2e8f0}
</style>
</head>
<body>
<div class="header"><div class="logo">Duka<span>Tracker</span> EMPIRE</div><div style="font-size:12px">👑 All Dukaz | <span id="conn">LOADING...</span></div></div>
<div class="card"><h3>🔒 Admin Login</h3><div style="display:flex;gap:8px;margin-top:10px"><input id="adminPass" type="password" class="input" placeholder="admin123" style="margin-bottom:0"><button class="btn btn-accent" onclick="loginAdmin()">Unlock</button></div></div>

<div id="dashboard" style="display:none">
<div class="grid2">
<div class="card stat"><h2 id="totalTenants">0</h2><p>Total Dukaz Managed</p><small id="rev" style="color:#10b981;font-weight:800"></small></div>
<div class="card stat"><h2 id="activeCount">0</h2><p>Active Subscriptions</p></div>
</div>

<!-- Create New Duka Card -->
<div class="card" style="background:#f0fdf4;border:2px solid #bbf7d0">
<h3>➕ Create New Duka - Own Link</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<input id="newShopName" class="input" placeholder="Shop name e.g Wanjiku Shop">
<input id="newCounty" class="input" placeholder="County e.g Mwea">
<input id="newPhone" class="input" placeholder="Phone e.g 0116982197">
<input id="newTenantId" class="input" placeholder="Auto ID" readonly>
</div>

<label style="font-size:12px;font-weight:700;display:block;margin-top:4px;">Subscription Plan</label>
<select id="newPlanType" class="select">
  <option value="Monthly">Monthly Pass (Ksh 300 / month)</option>
  <option value="Yearly">Yearly Pass (Ksh 2,500 / year)</option>
  <option value="Lifetime">Lifetime Pass 👑 (Ksh 5,000 one-time)</option>
</select>

<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-accent" onclick="generateId()">Generate ID</button><button class="btn btn-accent" onclick="createTenant()">Create + Get Link</button></div>
<div id="newLinkResult" style="margin-top:12px;background:white;padding:12px;border-radius:10px;display:none"></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3>All Tenants</h3>
    <input id="search" class="input" placeholder="Search shop..." style="width:200px;margin-bottom:0" oninput="renderTenants()">
  </div>
  <div id="tenantListContainer"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://mpwyzajhbzaabtdhqumj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wd3l6YWpoYnphYWJ0ZGhxdW1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2Njg3NzIsImV4cCI6MjEwOTI0NDc3Mn0.aBB0Uw5pBJc1H4eCcz3Tgmjx_18YQK3ye_pIiOpBELs";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let allTenants=[];

function loginAdmin(){ 
  if(document.getElementById('adminPass').value!=='admin123') return alert('Wrong password'); 
  document.getElementById('dashboard').style.display='block'; 
  loadData(); 
}

function getClerkLink(id){ return `https://duka-tracker-seven.vercel.app/?tenant=${id}`; }
function getBossLink(id){ return `https://duka-tracker-seven.vercel.app/boss.html?tenant=${id}`; }
function formatPhone(p){ if(!p) return ''; let n=p.replace(/\D/g,''); if(n.startsWith('0')) n='254'+n.slice(1); if(n.startsWith('254')) return n; return n; }

function waLink(shop, id, phone){
  let clerkLink = getClerkLink(id);
  let bossLink = getBossLink(id);
  let msg = `🇰🇪 *Duka Tracker - Access Details*\n\n` +
            `Hello Manager, here are your access credentials for *${shop}* (${id.toUpperCase()}):\n\n` +
            `👑 *Manager / Boss Portal:*\n${bossLink}\n\n` +
            `📋 *Clerk Delivery Portal:*\n${clerkLink}\n\n` +
            `🔑 *Shop ID / Pass:* ${id}\n\n` +
            `Please keep your password secure. Save this link. Karibu sana!`;

  if(phone){ return `https://wa.me/${formatPhone(phone)}?text=${encodeURIComponent(msg)}`; }
  return `https://wa.me/?text=${encodeURIComponent(msg)}`;
}

function generateId(){ 
  let name=document.getElementById('newShopName').value.trim().toLowerCase().replace(/\s+/g, '-')||'duka'; 
  let rand=Math.floor(Math.random()*900+100); 
  document.getElementById('newTenantId').value=`${name}-${rand}`; 
}

async function createTenant(){
 let shop=document.getElementById('newShopName').value.trim();
 let county=document.getElementById('newCounty').value.trim();
 let phone=document.getElementById('newPhone').value.trim();
 let id=document.getElementById('newTenantId').value.trim();
 let planType=document.getElementById('newPlanType').value;
 
 if(!shop || !county || !phone || !id) {
   return alert('Please fill in Shop Name, County, Phone, and generate an ID!');
 }
 
 document.getElementById('conn').innerText='SAVING...';
 let {error}=await client.from('tenants').insert({id, shop_name:shop, county, phone, plan_type:planType, is_active:true});
 if(error) {
   document.getElementById('conn').innerText='ONLINE ✓';
   return alert('Supabase Error: '+error.message);
 }

 let baseTime = Date.now();
 let starterProducts = [
   { id: baseTime + 1, tenant_id: id, name: 'Mkate', price: 60, cost: 50, stock: 20 },
   { id: baseTime + 2, tenant_id: id, name: 'Milk 500ml', price: 70, cost: 60, stock: 15 },
   { id: baseTime + 3, tenant_id: id, name: 'Sugar 1kg', price: 150, cost: 130, stock: 10 },
   { id: baseTime + 4, tenant_id: id, name: 'Eggs (1)', price: 30, cost: 22, stock: 30 },
   { id: baseTime + 5, tenant_id: id, name: 'Soda 300ml', price: 80, cost: 65, stock: 12 }
 ];
 await client.from('products').insert(starterProducts);

 let clerkLink=getClerkLink(id);
 let bossLink=getBossLink(id);
 let w=waLink(shop,id,phone);
 document.getElementById('newLinkResult').style.display='block';
 document.getElementById('newLinkResult').innerHTML=`✅ Created & Saved!<br><b>${shop}</b> (${id})<br><br><a href="${clerkLink}" target="_blank" style="color:#0f766e;font-weight:800;word-break:break-all">Clerk: ${clerkLink}</a><br><a href="${bossLink}" target="_blank" style="color:#047857;font-weight:800;word-break:break-all">Boss: ${bossLink}</a><br><br><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-accent" onclick="navigator.clipboard.writeText('${clerkLink}');alert('Clerk Link Copied!')">📋 Copy Clerk</button><button class="btn btn-boss" onclick="navigator.clipboard.writeText('${bossLink}');alert('Boss Link Copied!')">👑 Copy Boss</button><button class="btn btn-wa" onclick="window.open('${w}','_blank')">💬 WhatsApp Share</button></div>`;
 
 document.getElementById('newShopName').value = '';
 document.getElementById('newCounty').value = '';
 document.getElementById('newPhone').value = '';
 document.getElementById('newTenantId').value = '';
 document.getElementById('search').value = '';

 await loadData();
}

async function updateTenantPlan(id, newPlan){
 document.getElementById('conn').innerText='SAVING...';
 let {error}=await client.from('tenants').update({plan_type:newPlan}).eq('id',id);
 if(error) {
   document.getElementById('conn').innerText='ONLINE ✓';
   return alert('Failed to update plan: '+error.message);
 }
 alert(`Updated ${id} to ${newPlan} plan!`);
 await loadData();
}

async function loadData(){
 document.getElementById('conn').innerText='LOADING...';
 let {data: tenants}=await client.from('tenants').select('*').order('created_at',{ascending:false}).limit(2000);
 allTenants=tenants||[];
 let activeTenants = allTenants.filter(t=>t.is_active!==false);

 document.getElementById('totalTenants').innerText=allTenants.length;
 document.getElementById('activeCount').innerText=activeTenants.length;
 document.getElementById('rev').innerText=`${activeTenants.length} active shops`;

 renderTenants();
 document.getElementById('conn').innerText='ONLINE ✓';
}

function renderTenants(){
 let q=document.getElementById('search')?.value.toLowerCase().trim()||'';
 let list=q?allTenants.filter(t=>(t.id+t.shop_name+t.county).toLowerCase().includes(q)):allTenants;
 
 document.getElementById('tenantListContainer').innerHTML=list.map(t=>{
  let isActive=t.is_active!==false;
  let w=waLink(t.shop_name,t.id,t.phone);
  let plan=t.plan_type||'Monthly';
  let clerkLink=getClerkLink(t.id);
  let bossLink=getBossLink(t.id);

  return `<div class="shop-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <div>
        <b style="font-size:15px; color:#0f172a;">${t.shop_name}</b> 
        <span class="badge" style="background:#f1f5f9; color:#334155; margin-left:6px;">${t.id.toUpperCase()}</span>
      </div>
      <div>${isActive?'<span class="badge badge-green">ACTIVE</span>':'<span class="badge badge-red">BLOCKED</span>'}</div>
    </div>
    
    <div style="font-size:12px; color:#64748b; margin-bottom:10px;">Pass: ${t.id}</div>

    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
      <button class="btn btn-wa" onclick="window.open('${w}','_blank')">💬 Share WhatsApp</button>
      <button class="btn btn-boss" onclick="navigator.clipboard.writeText('${bossLink}');alert('Boss Link Copied!')">👑 Copy Boss</button>
      <button class="btn btn-clerk" onclick="navigator.clipboard.writeText('${clerkLink}');alert('Clerk Link Copied!')">📋 Copy Clerk</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f1f5f9; padding-top:8px;">
      <select onchange="updateTenantPlan('${t.id}', this.value)" class="select" style="width:170px; margin-bottom:0; font-size:12px;">
        <option value="Monthly" ${plan==='Monthly'?'selected':''}>Monthly (300)</option>
        <option value="Yearly" ${plan==='Yearly'?'selected':''}>Yearly (2.5k)</option>
        <option value="Lifetime" ${plan==='Lifetime'?'selected':''}>Lifetime (5k)</option>
      </select>
      <button class="btn ${isActive?'btn-danger':'btn-accent'}" onclick="toggleActive('${t.id}', ${isActive})">${isActive?'Block':'Activate'}</button>
    </div>
  </div>`;
 }).join('')||'<p style="padding:10px; color:#64748b;">No tenants found</p>';
}

async function toggleActive(id, current){ 
  // Instantly flip local state and redraw screen with zero delay
  let shop = allTenants.find(t => t.id === id);
  if(shop) shop.is_active = !current;
  renderTenants(); 

  // Push update to Supabase in the background
  document.getElementById('conn').innerText='SAVING...';
  let {error} = await client.from('tenants').update({is_active: !current}).eq('id', id); 
  
  if(error) {
    alert('Error: ' + error.message);
    if(shop) shop.is_active = current; // Revert state if cloud write failed
    renderTenants();
  }
  
  document.getElementById('conn').innerText='ONLINE ✓';
}
</script>
</body>
</html>
