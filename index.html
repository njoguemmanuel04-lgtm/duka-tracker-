function sanitize(str) {
  return str ? String(str).replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag)) : '';
}

function updateProductDropdown() {
  const select = document.getElementById('sellProduct');
  if (!products.length) {
    select.innerHTML = '<option value="">No products available</option>';
    return;
  }
  select.innerHTML = products.map(p => `
    <option value="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>
      ${sanitize(p.name)} - Ksh ${p.price} ${p.stock <= 0 ? '(OUT OF STOCK)' : `(Stock: ${p.stock})`}
    </option>
  `).join('');
}

function addToCart() {
  const pid = document.getElementById('sellProduct').value;
  const qty = parseFloat(document.getElementById('sellQty').value || 1);
  const prod = products.find(p => String(p.id) === String(pid));

  if (!prod) return alert('Select a valid product');
  if (qty <= 0) return alert('Quantity must be greater than zero');
  
  const cartItem = currentCart.find(item => String(item.id) === String(pid));
  const currentInCartQty = cartItem ? cartItem.qty : 0;

  if ((currentInCartQty + qty) > prod.stock) {
    return alert(`Cannot add more than available stock! Available: ${prod.stock - currentInCartQty}`);
  }

  if (cartItem) {
    cartItem.qty += qty;
    cartItem.qty = Math.round(cartItem.qty * 100) / 100;
    cartItem.total = cartItem.qty * cartItem.price;
    cartItem.costTotal = cartItem.qty * cartItem.cost;
  } else {
    currentCart.push({
      id: prod.id,
      name: prod.name,
      price: prod.price,
      cost: prod.cost,
      qty: qty,
      total: qty * prod.price,
      costTotal: qty * prod.cost
    });
  }

  document.getElementById('sellQty').value = 1;
  renderCart();
}

function renderCart() {
  const cartSec = document.getElementById('cartSection');
  const cartList = document.getElementById('cartItemsList');
  
  if (currentCart.length === 0) {
    cartSec.style.display = 'none';
    return;
  }

  cartSec.style.display = 'block';
  let grandTotal = 0;

  cartList.innerHTML = currentCart.map((item, index) => {
    grandTotal += item.total;
    return `
      <div class="row" style="padding:6px 0;">
        <div>
          <b>${sanitize(item.name)}</b><br>
          <span class="small">Ksh ${item.price} × ${item.qty}</span>
        </div>
        <div style="text-align:right;">
          <b>Ksh ${item.total}</b><br>
          <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ef4444; font-size:11px; font-weight:800; cursor:pointer;">Remove</button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('cartTotalText').innerText = 'Ksh ' + grandTotal.toLocaleString();
  calculateChange();
}

function removeFromCart(index) {
  currentCart.splice(index, 1);
  renderCart();
}

function clearCart() {
  currentCart = [];
  renderCart();
}

function togglePaymentFields() {
  const method = document.getElementById('sellPayment').value;
  document.getElementById('cashFields').style.display = method === 'Cash' ? 'block' : 'none';
  document.getElementById('mpesaFields').style.display = method === 'M-Pesa' ? 'block' : 'none';
  document.getElementById('debtFields').style.display = method === 'Debt' ? 'block' : 'none';
}

function calculateChange() {
  const grandTotal = currentCart.reduce((sum, item) => sum + item.total, 0);
  const given = parseFloat(document.getElementById('cashReceived').value || 0);
  const change = given - grandTotal;
  const changeEl = document.getElementById('changeDueText');

  if (given > 0) {
    changeEl.innerText = change >= 0 ? `Change Due: Ksh ${change.toLocaleString()}` : `Underpaid by: Ksh ${Math.abs(change).toLocaleString()}`;
    changeEl.style.color = change >= 0 ? '#2563eb' : '#ef4444';
  } else {
    changeEl.innerText = 'Change Due: Ksh 0';
    changeEl.style.color = '#2563eb';
  }
}

async function checkoutCart() {
  if (currentCart.length === 0) return alert('Cart is empty');

  const payMethod = document.getElementById('sellPayment').value;
  const customerName = sanitize(document.getElementById('sellCustomer').value.trim());
  const customerPhone = sanitize(document.getElementById('sellPhone').value.trim());
  const mpesaRef = sanitize(document.getElementById('mpesaRef').value.trim());

  if (payMethod === 'Debt' && !customerName) {
    return alert('Customer name is strictly required for Debt (Mkopo) sales.');
  }

  const batchId = 'TX-' + crypto.randomUUID().slice(0, 8).toUpperCase();
  const timestamp = new Date().toISOString();
  let createdSales = [];

  for (let item of currentCart) {
    let p = products.find(prod => String(prod.id) === String(item.id));
    if (p) {
      p.stock -= item.qty;
      p.stock = Math.round(p.stock * 100) / 100;
      // Queue stock update for cloud
      pendingProducts.push({action: 'upsert', product: p});
    }

    let saleEntry = {
      id: crypto.randomUUID(),
      batch_id: batchId,
      product_name: item.name,
      qty: item.qty,
      total: item.total,
      cost: item.costTotal,
      payment: payMethod,
      customer: customerName ? `${customerName} ${customerPhone ? '(' + customerPhone + ')' : ''}` : (mpesaRef ? `Ref: ${mpesaRef}` : ''),
      is_paid: payMethod !== 'Debt',
      created_at: timestamp,
      tenant_id: TENANT
    };

    sales.unshift(saleEntry);
    pending.push(saleEntry);
    createdSales.push(saleEntry);
  }

  saveLocal();
  renderAll();
  trySync();
  
  showReceiptModal(createdSales, payMethod);
  clearCart();
  
  document.getElementById('cashReceived').value = '';
  document.getElementById('sellCustomer').value = '';
  document.getElementById('sellPhone').value = '';
  document.getElementById('mpesaRef').value = '';
}

  dateEl.innerText = new Date().toLocaleString();

  let totalAmount = 0;

    totalAmount += s.total;
    return `<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
      <span>${sanitize(s.product_name)} x${s.qty}</span>
      <b>Ksh ${s.total}</b>

  }).join('');

  summaryHtml += `
    <div style="border-top:1px solid #e2e8f0; margin-top:8px; padding-top:6px; display:flex; justify-content:space-between; font-weight:800;">
      <span>Total Paid (${payment})</span>
      <span style="color:#10b981;">Ksh ${totalAmount.toLocaleString()}</span>
    </div>
  `;

  detailsEl.innerHTML = summaryHtml;
  modal.style.display = 'flex';
}

function sendDailyWhatsAppReport() {
  let todayStr = new Date().toDateString();
  let todaySales = sales.filter(s => new Date(s.created_at).toDateString() == todayStr);
  let todayMat = matumizi.filter(m => new Date(m.created_at).toDateString() == todayStr);

  let totalSalesAmount = todaySales.reduce((a, b) => a + b.total, 0);
  let totalOrdersCount = todaySales.length;
  
  let cashTotal = todaySales.filter(s => s.payment === 'Cash').reduce((a, b) => a + b.total, 0);
  let mpesaTotal = todaySales.filter(s => s.payment === 'M-Pesa').reduce((a, b) => a + b.total, 0);
  let mkopoTotal = todaySales.filter(s => s.payment === 'Debt').reduce((a, b) => a + b.total, 0);

  let totalCost = todaySales.reduce((a, b) => a + (b.cost || b.total * 0.83), 0);
  let totalMatAmount = todayMat.reduce((a, b) => a + b.amount, 0);
  let netProfit = Math.floor((totalSalesAmount - totalCost) - totalMatAmount);

  let reportText = `📊 *DUKA TRACKER - DAILY REPORT* 📊\n` +
                   `📅 Date: ${new Date().toLocaleDateString()}\n\n` +
                   `🛒 *Total Sales:* Ksh ${totalSalesAmount.toLocaleString()} (${totalOrdersCount} orders)\n` +
                   `💵 *Cash Received:* Ksh ${cashTotal.toLocaleString()}\n` +
                   `📱 *M-Pesa Total:* Ksh ${mpesaTotal.toLocaleString()}\n` +
                   `📖 *Mkopo (Debts):* Ksh ${mkopoTotal.toLocaleString()}\n` +
                   `💸 *Expenses Today:* Ksh ${totalMatAmount.toLocaleString()}\n\n` +
                   `-----------------------------------\n` +
                   `📈 *NET PROFIT:* Ksh ${netProfit.toLocaleString()}\n\n` +
                   `Powered by Duka Tracker 🚀`;

  let encodedText = encodeURIComponent(reportText);
  window.open(`https://wa.me/?text=${encodedText}`, '_blank');
}

async function trySync(){
 if(!navigator.onLine) return;
 
 // Sync Pending Sales
 if(pending.length > 0) {
   let toSend=[...pending];
   for(let s of toSend){
     let {error}=await client.from('sales').insert({tenant_id:TENANT,product_name:s.product_name,qty:s.qty,total:s.total,cost:s.cost,payment:s.payment,customer:s.customer||null,is_paid:s.is_paid,created_at:s.created_at});
     if(!error) pending=pending.filter(x=>x.id!==s.id);
   }
 }

 // Sync Pending Products
 if(pendingProducts.length > 0) {
   let prodToSend = [...pendingProducts];
   for(let item of prodToSend) {
     if(item.action === 'upsert') {
       let {error} = await client.from('products').upsert({
         id: item.product.id,
         tenant_id: TENANT,
         name: item.product.name,
         price: item.product.price,
         cost: item.product.cost,
         stock: item.product.stock
       });
       if(!error) pendingProducts = pendingProducts.filter(x => x !== item);
     } else if (item.action === 'delete') {
       let {error} = await client.from('products').delete().eq('id', item.id).eq('tenant_id', TENANT);
       if(!error) pendingProducts = pendingProducts.filter(x => x !== item);
     }
   }
 }

 saveLocal();
}

 document.getElementById('shopName').innerText='Loading...';
 if (navigator.onLine) {
   let {data}=await client.from('tenants').select('*').eq('id',TENANT).single();
   if(data){
     if(data.is_active===false){ 
       localStorage.setItem('duka_blocked_'+TENANT, 'true');
       renderBlockedScreen("⛔ Shop Subscription Needed", "Your shop subscription is inactive or expired.", "Select a plan below to activate:");
       return; 
     } else {
       localStorage.removeItem('duka_blocked_'+TENANT);
       localStorage.setItem('duka_last_check_'+TENANT, Date.now().toString());
     }
     document.getElementById('shopName').innerText=data.shop_name+' • '+data.county;
   } else {
     document.getElementById('shopName').innerText=TENANT;
   }
   
   // Fetch Cloud Products
   let {data: productsCloud} = await client.from('products').select('*').eq('tenant_id', TENANT);
   if(productsCloud && productsCloud.length) {
     products = productsCloud.map(p => ({
       id: p.id,
       name: p.name,
       price: p.price,
       cost: p.cost,
       stock: p.stock
     }));
     saveLocal(); renderAll();
   }

   let {data:salesCloud}=await client.from('sales').select('*').eq('tenant_id',TENANT).order('created_at',{ascending:false}).limit(200);
   if(salesCloud && salesCloud.length){
     let ids=new Set(sales.map(s=>s.id));
     salesCloud.forEach(cs=>{ if(!ids.has(cs.id)) sales.push(cs); });
     sales.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
     saveLocal(); renderAll();
   }
 } else {
   const nowTs = Date.now();
   const lastCheckTs = localStorage.getItem('duka_last_check_' + TENANT);
   const GRACE_PERIOD = 7 * 24 * 60 * 60 * 1000;
   
   if(localStorage.getItem('duka_blocked_' + TENANT) === 'true') {
     renderBlockedScreen("⛔ Shop Subscription Needed", "Your shop subscription is inactive or expired.", "Select a plan below to activate:");
     return;
   } else if (lastCheckTs && (nowTs - parseInt(lastCheckTs) > GRACE_PERIOD)) {
     renderBlockedScreen("⚠️ Connection Required", "Your 7-day offline grace period has expired.", "Please connect to the internet to verify subscription.");
     return;
   }
 }
}

function renderAll(){
 let now=new Date();
 let todayStr=now.toDateString();
 let todaySales=sales.filter(s=>new Date(s.created_at).toDateString()==todayStr);
 let todayMat=matumizi.filter(m=>new Date(m.created_at).toDateString()==todayStr);
 document.getElementById('salesToday').innerText='Ksh '+todaySales.reduce((a,b)=>a+b.total,0).toLocaleString();
 document.getElementById('ordersToday').innerText=todaySales.length+' orders today';
 document.getElementById('mkopoTotal').innerText='Ksh '+sales.filter(s=>!s.is_paid).reduce((a,b)=>a+b.total,0).toLocaleString();
 document.getElementById('matumiziToday').innerText='Ksh '+todayMat.reduce((a,b)=>a+b.amount,0).toLocaleString();

 // Raw calculations for profits and worth
 let rawProfitToday = Math.floor(todaySales.reduce((a,b)=>a+(b.total-(b.cost||b.total*0.83)),0)-todayMat.reduce((a,b)=>a+b.amount,0));
 let monthStart=new Date(now.getFullYear(), now.getMonth(), 1);
 let monthSales=sales.filter(s=>new Date(s.created_at)>=monthStart);
 let monthMat=matumizi.filter(m=>new Date(m.created_at)>=monthStart);
 let rawProfitMonth = Math.floor(monthSales.reduce((a,b)=>a+(b.total-(b.cost||b.total*0.83)),0)-monthMat.reduce((a,b)=>a+b.amount,0));
 let rawStockWorth = Math.floor(products.reduce((sum, p) => sum + (parseFloat(p.cost || 0) * parseFloat(p.stock || 0)), 0));

 // Apply PIN Security UI Masking
 if(isUnlocked) {
   document.getElementById('profitToday').innerText = 'Ksh ' + rawProfitToday.toLocaleString();
   document.getElementById('profitMonth').innerText = 'Ksh ' + rawProfitMonth.toLocaleString();
   document.getElementById('stockNetWorth').innerText = 'Ksh ' + rawStockWorth.toLocaleString();
   document.getElementById('lock-icon-today').innerText = '🔓';
   document.getElementById('lock-icon-month').innerText = '🔓';
   document.getElementById('lock-icon-worth').innerText = '🔓';
 } else {
   document.getElementById('profitToday').innerText = 'Ksh ****';
   document.getElementById('profitMonth').innerText = 'Ksh ****';
   document.getElementById('stockNetWorth').innerText = 'Ksh ****';
   document.getElementById('lock-icon-today').innerText = '🔒';
   document.getElementById('lock-icon-month').innerText = '🔒';
   document.getElementById('lock-icon-worth').innerText = '🔒';
 }

 let yesterday=new Date(now); yesterday.setDate(now.getDate()-1);
 let yStr=yesterday.toDateString();
 let ySales=sales.filter(s=>new Date(s.created_at).toDateString()==yStr);
 document.getElementById('salesYesterday').innerText='Ksh '+ySales.reduce((a,b)=>a+b.total,0).toLocaleString();
 document.getElementById('ordersYesterday').innerText=ySales.length+' orders';

 let dayOfWeek=now.getDay()==0?6:now.getDay()-1;
 let weekStart=new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate()-dayOfWeek);
 let weekSales=sales.filter(s=>new Date(s.created_at)>=weekStart);
 document.getElementById('salesWeek').innerText='Ksh '+weekSales.reduce((a,b)=>a+b.total,0).toLocaleString();
 document.getElementById('ordersWeek').innerText=weekSales.length+' orders this week';

 document.getElementById('salesMonth').innerText='Ksh '+monthSales.reduce((a,b)=>a+b.total,0).toLocaleString();
 document.getElementById('ordersMonth').innerText=monthSales.length+' orders this month';

 document.getElementById('quickSell').innerHTML=products.length?products.map(p=>`<button class="btn" style="margin-bottom:6px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0" onclick="quickSellById(${p.id})">${sanitize(p.name)} - Ksh ${p.price} • Stock ${p.stock}</button>`).join(''):'<p class="small">No products yet. Go to Stock → Add Product or Add Sample Products</p>';
 document.getElementById('todayList').innerHTML=todaySales.length?todaySales.slice(0,20).map(s=>`<div class="row"><div><b>${sanitize(s.product_name)}</b> x${s.qty}<br><span class="small">${new Date(s.created_at).toLocaleTimeString()} • ${sanitize(s.customer||'')}</span></div><div style="text-align:right"><b>Ksh ${s.total}</b><br><span class="badge ${s.payment=='M-Pesa'?'badge-green':s.payment=='Debt'?'badge-orange':''}">${s.payment}</span></div></div>`).join(''):'<p class="small">No sales today yet</p>';
 document.getElementById('allSalesList').innerHTML=sales.length?sales.slice(0,100).map(s=>`<div class="row"><div><b>${sanitize(s.product_name)}</b> x${s.qty}<br><span class="small">${new Date(s.created_at).toLocaleDateString()} ${new Date(s.created_at).toLocaleTimeString()}</span></div><div><b>Ksh ${s.total}</b><br><span class="badge">${s.payment}</span></div></div>`).join(''):'<p class="small">No sales yet</p>';
 
 document.getElementById('stockList').innerHTML=products.length?products.map(p=>{
   let isLowStock = p.stock <= 5 && p.stock > 0;
   let isOutOfStock = p.stock <= 0;
   let stockBadge = isOutOfStock 
     ? `<span class="badge badge-red">OUT OF STOCK</span>` 
     : isLowStock 
     ? `<span class="badge badge-orange">⚠️ Low Stock (${p.stock})</span>` 
     : `<b>Stock: ${p.stock}</b>`;

   return `<div class="row">
     <div>
       <b>${sanitize(p.name)}</b><br>
       <span style="font-size:12px; color:#0f172a; font-weight:700;">Buying: Ksh ${p.cost} | Selling: Ksh ${p.price}</span><br>
       <span class="small" style="color:#166534; font-weight:700;">Profit per item: Ksh ${p.price - p.cost}</span>
     </div>
     <div style="text-align:right">
       ${stockBadge}<br>
       <div style="display:flex;gap:4px;margin-top:4px">
         <button onclick="addStock(${p.id})" style="padding:4px 8px;border-radius:6px;border:none;background:#dcfce7;font-weight:800">+ Stock</button>
         <button onclick="deleteProduct(${p.id})" style="padding:4px 8px;border-radius:6px;border:none;background:#fee2e2;color:#991b1b;font-weight:800">Delete</button>
       </div>
     </div>
   </div>`;
 }).join(''):'<p class="small">No products. Add your first product above.</p>';

 document.getElementById('mkopoList').innerHTML=sales.filter(s=>!s.is_paid).length?sales.filter(s=>!s.is_paid).map(s=>`<div class="row"><div><b>${sanitize(s.customer||'Customer')}</b><br><span class="small">${sanitize(s.product_name)} x${s.qty} • ${new Date(s.created_at).toLocaleDateString()}</span></div><div style="text-align:right"><b>Ksh ${s.total}</b><br><button class="btn btn-green" style="padding:6px 10px;width:auto;margin-top:4px" onclick="markPaid('${s.id}')">Mark Paid</button></div></div>`).join(''):'<p class="small">No active debts 🎉</p>';
 document.getElementById('matumiziList').innerHTML=todayMat.length?todayMat.map(m=>`<div class="row"><div><b>${sanitize(m.desc)}</b><br><span class="small">${new Date(m.created_at).toLocaleTimeString()}</span></div><b>Ksh ${m.amount}</b></div>`).join(''):'<p class="small">No matumizi today</p>';

 updateProductDropdown();
}

window.addEventListener('online',()=>{document.getElementById('syncStatus').innerText='🟢 Online'; trySync(); loadShop();});
window.addEventListener('offline',()=>{document.getElementById('syncStatus').innerText='🔴 Offline - Sales saved in phone';});
if(!navigator.onLine) document.getElementById('syncStatus').innerText='🔴 Offline - Sales saved in phone';

saveLocal(); 
renderAll(); 
loadShop(); 
trySync();
setInterval(trySync,10000);
</script>
